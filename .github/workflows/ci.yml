name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore RosterVSDD.slnx

    - name: Build
      run: dotnet build RosterVSDD.slnx --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/RosterVSDD.UnitTests --no-build --verbosity normal

    - name: Run integration tests
      run: dotnet test tests/RosterVSDD.IntegrationTests --no-build --verbosity normal
